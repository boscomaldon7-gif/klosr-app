# Klosr — Cross-platform release build pipeline
#
# Triggers:
#   - Push of a `v*` tag (e.g. `v0.1.3`) → builds + publishes a GitHub Release
#   - Manual dispatch from the Actions tab → builds + drafts a Release
#
# Produces installers for:
#   - macOS Intel  (x86_64-apple-darwin)         → .dmg
#   - macOS Apple Silicon (aarch64-apple-darwin) → .dmg
#   - Windows x64  (x86_64-pc-windows-msvc)      → .msi + .exe
#   - Windows ARM64 (aarch64-pc-windows-msvc)    → .msi + .exe
#   - Linux x64    (x86_64-unknown-linux-gnu)    → .deb + .AppImage
#
# All artifacts are uploaded to GitHub Releases. The auto-updater endpoint
# at /api/updater/[target]/[currentVersion] reads from these releases.
#
# Required secrets (set in Settings → Secrets and variables → Actions):
#   TAURI_PRIVATE_KEY            — for signing updater bundles
#   TAURI_KEY_PASSWORD           — passphrase for that key
#   APPLE_CERTIFICATE            — base64 of .p12 cert (Mac signing)
#   APPLE_CERTIFICATE_PASSWORD   — passphrase
#   APPLE_SIGNING_IDENTITY       — e.g. "Developer ID Application: ... (TEAMID)"
#   APPLE_ID                     — Apple ID for notarization
#   APPLE_PASSWORD               — app-specific password
#   APPLE_TEAM_ID                — Apple Developer Team ID
#   WINDOWS_CERTIFICATE          — base64 of .pfx for code signing (optional v1)
#   WINDOWS_CERTIFICATE_PASSWORD — passphrase

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.1.4)"
        required: true
        default: "v0.1.4"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"  # Apple Silicon runners
            args: "--target aarch64-apple-darwin"
            label: "macos-arm64"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            label: "macos-x64"
          - platform: "ubuntu-22.04"
            args: ""
            label: "linux-x64"
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
            label: "windows-x64"
          - platform: "windows-11-arm"  # if available; falls back to cross-compile
            args: "--target aarch64-pc-windows-msvc"
            label: "windows-arm64"

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: klosr-native
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.args == '' && '' || matrix.args == '--target x86_64-pc-windows-msvc' && 'x86_64-pc-windows-msvc' || matrix.args == '--target aarch64-pc-windows-msvc' && 'aarch64-pc-windows-msvc' || matrix.args == '--target x86_64-apple-darwin' && 'x86_64-apple-darwin' || matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install npm deps
        run: npm ci

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            klosr-native/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ matrix.label }}-${{ hashFiles('**/Cargo.lock') }}

      # Conditionally export Apple signing vars from a SHELL step (the only
      # place we can safely conditional-on-secret without GHA expression hacks).
      # If APPLE_CERTIFICATE secret is empty (the common case), we don't write
      # any APPLE_* vars to GITHUB_ENV — tauri-action sees them as truly unset
      # and skips the codesign path entirely. Mac DMGs ship UNSIGNED.
      - name: Detect Apple signing secrets
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERT_INPUT: ${{ secrets.APPLE_CERTIFICATE }}
        shell: bash
        run: |
          if [ -n "$APPLE_CERT_INPUT" ]; then
            echo "Apple signing secrets detected — enabling code-sign + notarize path"
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}" >> $GITHUB_ENV
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> $GITHUB_ENV
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> $GITHUB_ENV
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV
          else
            echo "No Apple signing secrets — Mac DMG will be UNSIGNED."
            echo "Users will see Gatekeeper warning on first launch — right-click → Open."
          fi

      - name: Build + Bundle (unsigned by default; signs if Apple secrets set)
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: ./klosr-native
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Klosr ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            See https://klosr.com/changelog for what's new.

            **Install:**
            - Mac (Apple Silicon): download the `.dmg` for `aarch64-apple-darwin`
            - Mac (Intel): download the `.dmg` for `x86_64-apple-darwin`
            - Windows (x64): download the `_x64-setup.exe` or `_x64_en-US.msi`
            - Windows (ARM): download the `_arm64-setup.exe` or `_arm64_en-US.msi`
            - Linux: download the `.deb` (Debian/Ubuntu) or `.AppImage`

            **First-run on Windows:** SmartScreen will warn — click "More info" → "Run anyway". This goes away once we sign the binaries.
            **First-run on macOS:** Right-click the .dmg → "Open" → "Open anyway" (Gatekeeper warning).
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # ────────────────────────────────────────────────────────────────
      # macOS post-bundle: inject Info.plist usage descriptions + rebuild DMG
      #
      # Tauri 2's auto-generated Info.plist is missing the macOS usage
      # description strings. Without these, macOS SILENTLY denies the
      # capture_screen and CGEvent (inject_text) APIs even when the user
      # has granted permissions in System Settings.
      #
      # We use `plutil -insert` to add the keys directly to the bundled
      # Info.plist, then rebuild the .dmg from the patched .app, then
      # replace the asset on the GitHub Release with `gh release upload --clobber`.
      # ────────────────────────────────────────────────────────────────
      - name: Patch Info.plist + rebuild DMG (macOS only)
        if: matrix.platform == 'macos-latest' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TRIPLE: ${{ matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
          DMG_ARCH: ${{ matrix.args == '--target aarch64-apple-darwin' && 'aarch64' || 'x64' }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        working-directory: klosr-native
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/${TARGET_TRIPLE}/release/bundle/macos/Klosr.app"
          PLIST="${APP_PATH}/Contents/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "::warning::Info.plist not found at $PLIST — skipping patch"
            exit 0
          fi

          echo "→ Patching Info.plist at $PLIST"
          plutil -insert NSScreenCaptureUsageDescription -string \
            "Klosr reads your screen to detect sales conversations and draft replies in your voice." "$PLIST" || true
          plutil -insert NSAccessibilityUsageDescription -string \
            "Klosr types drafted replies into your active app's composer (WhatsApp, Slack, etc.)." "$PLIST" || true
          plutil -insert NSAppleEventsUsageDescription -string \
            "Klosr uses Apple Events to coordinate with other apps when injecting drafts." "$PLIST" || true
          plutil -insert NSInputMonitoringUsageDescription -string \
            "Klosr listens for the global hotkey (Cmd+Shift+K) to show/hide the capsule." "$PLIST" || true
          plutil -insert NSHighResolutionCapable -bool true "$PLIST" 2>/dev/null || true

          # Replace existing keys if present (insert fails silently above for existing keys)
          plutil -replace NSScreenCaptureUsageDescription -string \
            "Klosr reads your screen to detect sales conversations and draft replies in your voice." "$PLIST"
          plutil -replace NSAccessibilityUsageDescription -string \
            "Klosr types drafted replies into your active app's composer (WhatsApp, Slack, etc.)." "$PLIST"
          plutil -replace NSAppleEventsUsageDescription -string \
            "Klosr uses Apple Events to coordinate with other apps when injecting drafts." "$PLIST"

          echo "→ Verifying patched plist:"
          plutil -p "$PLIST" | grep -E "NS(Screen|Accessibility|AppleEvents|InputMonitoring)" || true

          # Strip quarantine xattr (set by curl/browser downloads — causes "damaged" error)
          xattr -cr "$APP_PATH" || true

          # Rebuild the DMG so the patched .app is the one users download.
          DMG_DIR="src-tauri/target/${TARGET_TRIPLE}/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          # Find the existing dmg (tauri names it Klosr_<ver>_<arch>.dmg)
          OLD_DMG=$(ls "$DMG_DIR"/Klosr_*_${DMG_ARCH}.dmg 2>/dev/null | head -1 || echo "")
          NEW_DMG="$DMG_DIR/Klosr_patched_${DMG_ARCH}.dmg"
          rm -f "$NEW_DMG"

          echo "→ Creating fresh DMG with patched .app"
          hdiutil create -volname "Klosr" -srcfolder "$APP_PATH" -ov -format UDZO "$NEW_DMG"

          if [ -n "$OLD_DMG" ]; then
            mv -f "$NEW_DMG" "$OLD_DMG"
            FINAL_DMG="$OLD_DMG"
          else
            FINAL_DMG="$NEW_DMG"
          fi
          echo "→ Final DMG: $FINAL_DMG"

          # Replace the asset on the GitHub Release
          ASSET_NAME=$(basename "$FINAL_DMG")
          echo "→ Replacing $ASSET_NAME on release $TAG"
          gh release upload "$TAG" "$FINAL_DMG" --repo "${{ github.repository }}" --clobber
          echo "✓ Patched DMG uploaded"
