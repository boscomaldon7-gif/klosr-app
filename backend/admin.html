<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klosr Admin · Live</title>
  <style>
    /* ════════════════════════════════════════════════════════════════
     * Klosr admin dashboard — live, single-file, no build, no deps.
     * Polls /api/intel admin-stats every 8s. Animates new events in.
     * Designed for solo founder use (one screen, scannable in 5 sec).
     * ════════════════════════════════════════════════════════════════ */

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #0A0A0B; color: #F4F4F5;
                 font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
                 -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 28px 24px 60px; }

    a { color: #FFD60A; text-decoration: none; }
    button { font-family: inherit; }

    /* ── Top bar ──────────────────────────────────────────────────── */
    header { display: flex; align-items: center; justify-content: space-between;
             margin-bottom: 24px; flex-wrap: wrap; gap: 14px; }
    h1 { font-size: 22px; margin: 0; color: #FFD60A; letter-spacing: -0.01em; }
    h1 .sub { color: rgba(244,244,245,0.45); font-size: 12px; font-weight: 400;
              margin-left: 12px; letter-spacing: 0.04em; }

    .live-pill { display: inline-flex; align-items: center; gap: 6px;
                 padding: 4px 10px; background: rgba(110, 231, 183, 0.10);
                 border: 1px solid rgba(110, 231, 183, 0.40); border-radius: 999px;
                 font-size: 11px; font-weight: 700; color: #6EE7B7;
                 letter-spacing: 0.04em; text-transform: uppercase; }
    .live-pill.paused { background: rgba(244,244,245,0.05); border-color: rgba(244,244,245,0.15);
                        color: rgba(244,244,245,0.55); }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #34D399;
                animation: live-pulse 1.6s ease-in-out infinite; }
    .live-pill.paused .live-dot { background: rgba(244,244,245,0.40); animation: none; }
    @keyframes live-pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55); }
      50%      { opacity: 0.55; box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
    }

    .top-actions { display: flex; gap: 6px; }
    .btn { background: rgba(255,214,10,0.12); border: 1px solid rgba(255,214,10,0.4);
           color: #FFD60A; font-size: 12px; font-weight: 600; padding: 7px 13px;
           border-radius: 7px; cursor: pointer; transition: filter 120ms; }
    .btn:hover { filter: brightness(1.15); }
    .btn:disabled { opacity: 0.5; cursor: wait; }
    .btn-ghost { background: transparent; color: rgba(244,244,245,0.55);
                 border-color: rgba(244,244,245,0.15); }
    .btn-ghost:hover { color: #fff; }

    /* ── Login screen ─────────────────────────────────────────────── */
    .login { max-width: 340px; margin: 120px auto; padding: 28px;
             background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
             border-radius: 12px; }
    .login h2 { color: #FFD60A; margin: 0 0 16px; font-size: 18px; }
    .login input { width: 100%; padding: 10px 12px; background: rgba(0,0,0,0.3);
                   border: 1px solid rgba(255,255,255,0.12); border-radius: 7px;
                   color: #F4F4F5; font-family: inherit; font-size: 14px; }
    .login input:focus { outline: none; border-color: #FFD60A; }
    .login .btn { width: 100%; margin-top: 12px; padding: 10px; font-size: 14px; }
    .login-error { color: #F87171; font-size: 12px; margin-top: 8px; }

    /* ── Stat cards ───────────────────────────────────────────────── */
    .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
             margin-bottom: 22px; }
    .stat { padding: 14px 16px; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
            transition: border-color 200ms, transform 200ms; }
    .stat.flash { border-color: rgba(255,214,10,0.55); transform: translateY(-1px); }
    .stat-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
                  text-transform: uppercase; color: rgba(244,244,245,0.55);
                  margin-bottom: 6px; }
    .stat-value { font-size: 26px; font-weight: 800; color: #FFD60A;
                  font-variant-numeric: tabular-nums; line-height: 1.05; }
    .stat-sub { font-size: 10.5px; color: rgba(244,244,245,0.45); margin-top: 4px; }
    .stat-now { background: rgba(110, 231, 183, 0.05); border-color: rgba(110, 231, 183, 0.25); }
    .stat-now .stat-value { color: #6EE7B7; }

    /* ── Section frames ───────────────────────────────────────────── */
    section { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.07);
              border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
    section h2 { font-size: 12.5px; font-weight: 800; letter-spacing: 0.06em;
                 text-transform: uppercase; color: rgba(244,244,245,0.70);
                 margin: 0; padding: 11px 18px; border-bottom: 1px solid rgba(255,255,255,0.06);
                 background: rgba(0,0,0,0.15);
                 display: flex; justify-content: space-between; align-items: center; }
    section h2 .h-meta { font-weight: 400; opacity: 0.55; text-transform: none; letter-spacing: 0; font-size: 11px; }

    /* ── Funnel ──────────────────────────────────────────────────── */
    .funnel { display: grid; grid-template-columns: repeat(5, 1fr); padding: 16px 18px; gap: 8px; }
    .funnel-step { padding: 14px 14px; background: rgba(0,0,0,0.20);
                   border: 1px solid rgba(255,255,255,0.06); border-radius: 8px;
                   position: relative; }
    .funnel-step::after { content: "→"; position: absolute; right: -14px; top: 50%;
                          transform: translateY(-50%); color: rgba(255,214,10,0.45);
                          font-size: 16px; font-weight: 700; }
    .funnel-step:last-child::after { display: none; }
    .funnel-label { font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
                    text-transform: uppercase; color: rgba(244,244,245,0.55); }
    .funnel-icon { font-size: 14px; margin-right: 4px; }
    .funnel-count { font-size: 22px; font-weight: 800; color: #FFD60A;
                    font-variant-numeric: tabular-nums; margin-top: 4px; line-height: 1.05; }
    .funnel-conv { font-size: 10.5px; color: rgba(244,244,245,0.55); margin-top: 4px;
                   font-variant-numeric: tabular-nums; }
    .funnel-conv.high { color: #6EE7B7; }
    .funnel-conv.low  { color: #F87171; }

    /* ── 30-day line chart ───────────────────────────────────────── */
    .chart-box { padding: 16px 18px; }
    .chart-svg { width: 100%; height: 130px; display: block; }
    .chart-axis { font-size: 10px; fill: rgba(244,244,245,0.35); font-variant-numeric: tabular-nums; }
    .chart-line { fill: none; stroke: #FFD60A; stroke-width: 2; }
    .chart-area { fill: url(#grad); opacity: 0.30; }
    .chart-dot { fill: #FFD60A; }
    .chart-today { fill: #FFD60A; r: 4; filter: drop-shadow(0 0 6px rgba(255, 214, 10, 0.7)); }

    /* ── Feature usage grid ──────────────────────────────────────── */
    .features { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 6px; padding: 12px 18px; }
    .feature { display: flex; align-items: center; justify-content: space-between;
               padding: 7px 11px; background: rgba(255,255,255,0.03); border-radius: 6px;
               font-size: 11.5px; transition: background 120ms; }
    .feature:hover { background: rgba(255,214,10,0.06); }
    .feature.zero { opacity: 0.42; }
    .feature-name { color: rgba(244,244,245,0.80);
                    font-family: ui-monospace, SFMono-Regular, "SF Mono", Monaco, Menlo, monospace;
                    font-size: 11px; }
    .feature-count { font-weight: 700; color: #FFD60A; font-variant-numeric: tabular-nums; }
    .feature-count .stale { color: rgba(244,244,245,0.40); font-weight: 400; margin-left: 5px; }

    /* ── Users table ─────────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { padding: 8px 14px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
    th { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
         color: rgba(244,244,245,0.50); background: rgba(0,0,0,0.15);
         position: sticky; top: 0; }
    tbody tr { cursor: pointer; transition: background 120ms; }
    tbody tr:hover { background: rgba(255,214,10,0.05); }
    .mono { font-family: ui-monospace, monospace; font-size: 11px; color: rgba(244,244,245,0.55); }
    .tag { display: inline-block; font-size: 9.5px; padding: 2px 7px; border-radius: 999px;
           background: rgba(147,197,253,0.12); color: #BFDBFE; font-weight: 700;
           letter-spacing: 0.04em; text-transform: uppercase; }
    .tag-hot { background: rgba(52,211,153,0.14); color: #6EE7B7; }
    .tag-now { background: rgba(110, 231, 183, 0.20); color: #6EE7B7;
               animation: tag-pulse 1.6s ease-in-out infinite; }
    @keyframes tag-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.50); }
      50%      { box-shadow: 0 0 0 4px rgba(52, 211, 153, 0); }
    }

    /* ── Live event stream ───────────────────────────────────────── */
    .controls { padding: 8px 18px; display: flex; gap: 6px; flex-wrap: wrap;
                border-bottom: 1px solid rgba(255,255,255,0.04);
                background: rgba(0,0,0,0.10); }
    .filter-pill { padding: 4px 10px; background: rgba(255,255,255,0.04);
                   border: 1px solid rgba(255,255,255,0.10); border-radius: 999px;
                   color: rgba(244,244,245,0.70); font-size: 11px; font-weight: 600;
                   cursor: pointer; transition: all 120ms; }
    .filter-pill:hover { color: #FFD60A; border-color: rgba(255,214,10,0.45); }
    .filter-pill.active { background: rgba(255,214,10,0.12); color: #FFD60A;
                          border-color: rgba(255,214,10,0.55); }

    .events { padding: 4px 0; max-height: 480px; overflow-y: auto; }
    .event-row { display: grid; grid-template-columns: 70px 200px 1fr 180px;
                 gap: 12px; padding: 7px 18px; font-size: 11.5px;
                 border-bottom: 1px solid rgba(255,255,255,0.03);
                 transition: background 120ms; }
    .event-row.fresh { background: rgba(255,214,10,0.07);
                       animation: event-flash 1.4s ease-out; }
    @keyframes event-flash {
      0%   { background: rgba(255,214,10,0.20); }
      100% { background: rgba(0,0,0,0); }
    }
    .event-row:hover { background: rgba(255,255,255,0.02); }
    .event-time { color: rgba(244,244,245,0.45); font-variant-numeric: tabular-nums;
                  font-family: ui-monospace, monospace; }
    .event-name { font-weight: 700; color: #FFD60A; font-family: ui-monospace, monospace;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event-meta { color: rgba(244,244,245,0.65); word-break: break-word;
                  font-family: ui-monospace, monospace; font-size: 10.5px;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event-user { color: rgba(244,244,245,0.55); font-family: ui-monospace, monospace;
                  text-align: right; cursor: pointer; }
    .event-user:hover { color: #FFD60A; }

    /* ── User drill-down modal ───────────────────────────────────── */
    .modal-bg { position: fixed; inset: 0; background: rgba(10,10,11,0.75);
                backdrop-filter: blur(4px); z-index: 100; display: flex;
                align-items: center; justify-content: center; padding: 20px;
                animation: fade-in 0.18s ease; }
    .modal { background: #0F0F12; border: 1px solid rgba(255,255,255,0.10);
             border-radius: 14px; max-width: 720px; width: 100%; max-height: 85vh;
             display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
    .modal-head { display: flex; justify-content: space-between; align-items: flex-start;
                  padding: 18px 22px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .modal-head h3 { margin: 0 0 4px; font-size: 17px; color: #FFD60A; letter-spacing: -0.01em; }
    .modal-head .modal-sub { font-size: 12px; color: rgba(244,244,245,0.55); }
    .modal-close { background: transparent; border: none; color: rgba(244,244,245,0.55);
                   font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1; }
    .modal-close:hover { color: #fff; }
    .modal-body { padding: 16px 22px; overflow-y: auto; }
    .modal-grid { display: grid; grid-template-columns: 130px 1fr; gap: 8px 14px;
                  font-size: 12.5px; margin-bottom: 18px; }
    .modal-grid .k { color: rgba(244,244,245,0.50); font-weight: 600;
                     letter-spacing: 0.04em; text-transform: uppercase; font-size: 10.5px;
                     padding-top: 2px; }
    .modal-grid .v { color: #F4F4F5; word-break: break-word; }

    .timeline-h { font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
                  text-transform: uppercase; color: rgba(244,244,245,0.50);
                  margin: 0 0 8px; }
    .timeline { font-size: 11.5px; }
    .timeline-row { display: grid; grid-template-columns: 80px 1fr; gap: 10px;
                    padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .timeline-time { color: rgba(244,244,245,0.45); font-family: ui-monospace, monospace;
                     font-variant-numeric: tabular-nums; }
    .timeline-event { color: #FFD60A; font-family: ui-monospace, monospace; font-weight: 600; }
    .timeline-event .meta { color: rgba(244,244,245,0.55); font-weight: 400; margin-left: 6px; font-size: 10.5px; }

    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    .empty { text-align: center; padding: 40px; color: rgba(244,244,245,0.40);
             font-style: italic; font-size: 12px; }
    .error { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.35);
             color: #FCA5A5; padding: 14px 18px; border-radius: 10px; font-size: 13px; }

    @media (max-width: 1000px) {
      .stats { grid-template-columns: repeat(3, 1fr); }
      .funnel { grid-template-columns: repeat(3, 1fr); }
      .funnel-step::after { display: none; }
    }
    @media (max-width: 700px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .funnel { grid-template-columns: 1fr 1fr; }
      .event-row { grid-template-columns: 60px 1fr; }
      .event-row .event-user, .event-row .event-meta { display: none; }
      th.hide-sm, td.hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // ─────────── Endpoint configuration ───────────
    // Same /api/intel dispatcher the extension uses. action: "admin-stats"
    // gated by ADMIN_PASSWORD env var. Password lives in sessionStorage so
    // it disappears when the tab closes — no localStorage persistence.
    const INTEL_URL = "/api/intel";
    const PW_KEY = "klosr_admin_pw";
    const POLL_INTERVAL_MS = 8000;          // 8s ≈ live without hammering Upstash
    const ACTIVE_NOW_WINDOW_MS = 5 * 60_000; // events in last 5 min = "active right now"

    // ─────────── Tiny utils ───────────
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function fmtRelative(ms) {
      if (!ms) return "—";
      const sec = (Date.now() - Number(ms)) / 1000;
      if (sec < 60)    return Math.round(sec) + "s ago";
      if (sec < 3600)  return Math.round(sec / 60) + "m ago";
      if (sec < 86400) return Math.round(sec / 3600) + "h ago";
      return Math.round(sec / 86400) + "d ago";
    }
    function fmtTime(ts) {
      const d = new Date(Number(ts) || 0);
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      const ss = String(d.getSeconds()).padStart(2, "0");
      return `${hh}:${mm}:${ss}`;
    }
    function fmtNum(n) {
      n = Number(n) || 0;
      return n.toLocaleString();
    }
    function pct(num, denom) {
      if (!denom || denom === 0) return "—";
      return Math.round((num / denom) * 100) + "%";
    }

    async function fetchStats(pw) {
      const res = await fetch(INTEL_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "admin-stats", params: { password: pw } }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    async function fetchWaitlist(pw) {
      const res = await fetch(INTEL_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "waitlist-recent", params: { password: pw, limit: 500 } }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    async function refreshWaitlist() {
      const pw = sessionStorage.getItem(PW_KEY);
      if (!pw) return;
      const w = await fetchWaitlist(pw).catch(() => null);
      if (w && w.ok) {
        state.waitlist = { count: w.count || 0, entries: w.entries || [], loaded: true };
        if (state.lastData) renderDashboard(state.lastData);
      }
    }

    function exportWaitlistCSV() {
      const entries = state.waitlist.entries || [];
      if (!entries.length) return;
      const header = ["name", "email", "phone", "source", "joined_iso"];
      const lines = [header.join(",")];
      for (const e of entries) {
        const row = [e.name || "", e.email || "", e.phone || "", e.source || "", e.ts ? new Date(Number(e.ts)).toISOString() : ""]
          .map(v => `"${String(v).replace(/"/g, '""')}"`).join(",");
        lines.push(row);
      }
      const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `klosr-waitlist-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ─────────── State ───────────
    // Closure-scoped state for the live loop. Keeps track of:
    //  - which event IDs we've already shown (so re-renders don't re-flash)
    //  - the active filter pill
    //  - whether polling is paused (user clicked Pause)
    //  - last data snapshot (for stat-flash compare on diff)
    const state = {
      seenEventKeys: new Set(),
      eventFilter: "all",          // "all" | event name
      isPaused: false,
      pollTimer: null,
      lastData: null,
      currentModalUser: null,
      waitlist: { count: 0, entries: [], loaded: false },
    };

    // ─────────── Login ───────────
    function renderLogin(errorMsg) {
      document.getElementById("app").innerHTML = `
        <div class="login">
          <h2>Klosr Admin · Live</h2>
          <form id="login-form">
            <input type="password" id="pw" placeholder="Admin password" autofocus />
            <button class="btn" type="submit">Enter</button>
            ${errorMsg ? `<div class="login-error">${esc(errorMsg)}</div>` : ""}
          </form>
        </div>
      `;
      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const pw = document.getElementById("pw").value;
        const data = await fetchStats(pw).catch(() => ({ ok: false, reason: "network" }));
        if (data && data.ok) {
          sessionStorage.setItem(PW_KEY, pw);
          startLive(data);
        } else {
          renderLogin(
            data?.reason === "unauthorized" ? "Wrong password."
            : data?.reason === "upstash_not_configured" ? "Upstash not configured server-side."
            : "Couldn't fetch stats."
          );
        }
      });
    }

    // ─────────── Live loop ───────────
    function startLive(initialData) {
      state.lastData = initialData;
      renderDashboard(initialData);
      refreshWaitlist();
      schedulePoll();
    }

    function schedulePoll() {
      if (state.pollTimer) clearTimeout(state.pollTimer);
      if (state.isPaused) return;
      state.pollTimer = setTimeout(async () => {
        const pw = sessionStorage.getItem(PW_KEY);
        if (!pw) return;
        const [fresh, w] = await Promise.all([
          fetchStats(pw).catch(() => null),
          fetchWaitlist(pw).catch(() => null),
        ]);
        if (w && w.ok) state.waitlist = { count: w.count || 0, entries: w.entries || [], loaded: true };
        if (fresh && fresh.ok) {
          state.lastData = fresh;
          renderDashboard(fresh, /* isLiveTick */ true);
        } else if (w && w.ok && state.lastData) {
          renderDashboard(state.lastData, /* isLiveTick */ true);
        }
        schedulePoll();
      }, POLL_INTERVAL_MS);
    }

    // ─────────── Build derived metrics ───────────
    // Funnel = the 4-step sales motion. Event names match what the extension
    // logs (or will log once you wire telemetry into Power Hour / Calendar /
    // Coach / Follow-up). Each stage falls back gracefully when the event
    // name isn't seen yet — shows 0 instead of breaking.
    function buildFunnel(features7d) {
      const f = features7d || {};
      const dms = (f.power_hour_dm_sent || 0) + (f.dm_drafted || 0) + (f.connection_drafted || 0);
      const meetings = f.meeting_booked || f.calendar_invite_detected || 0;
      const calls    = f.call_coached || f.live_assist_started || 0;
      const followups = f.followup_drafted || f.followup_autofilled || 0;
      const wins      = f.deal_won || 0;
      return [
        { icon: "📤", label: "Outbound",   sub: "DMs sent",      count: dms,       prev: null },
        { icon: "📅", label: "Meeting",    sub: "Booked",        count: meetings,  prev: dms },
        { icon: "🎙️", label: "Coached",    sub: "Live call",     count: calls,     prev: meetings },
        { icon: "📨", label: "Follow-up",  sub: "Sent",          count: followups, prev: calls },
        { icon: "💰", label: "Closed",     sub: "Deals won",     count: wins,      prev: followups },
      ];
    }

    function activeNow(events) {
      const cutoff = Date.now() - ACTIVE_NOW_WINDOW_MS;
      const ids = new Set();
      for (const e of (events || [])) {
        if (Number(e.ts) >= cutoff && e.installId) ids.add(e.installId);
      }
      return ids.size;
    }

    function eventKey(e) {
      // Stable key for de-duping the live stream. Composite because Redis
      // doesn't return its own list IDs and timestamps can collide on bursts.
      return `${e.ts}|${e.installId}|${e.event}`;
    }

    // ─────────── Render ───────────
    function renderDashboard(data, isLiveTick) {
      const o = data.overview || {};
      const f7 = data.features7d || {};
      const f30 = data.features30d || {};
      const users = data.users || [];
      const events = data.recentEvents || [];

      const funnelSteps = buildFunnel(f7);
      const nowActive = activeNow(events);

      // Daily activity — backend only returns 7 days, but we show a 30-day
      // sparkline by padding with zeros. When backend ships 30 we'll just
      // get the real data; no client change needed.
      const daily = [...(o.dailyActive || [])].slice(-30);

      document.getElementById("app").innerHTML = `
        <div class="wrap">
          <header>
            <h1>
              Klosr Admin
              <span class="sub">· generated ${fmtRelative(new Date(data.generatedAt).getTime())}</span>
            </h1>
            <div class="top-actions">
              <span class="live-pill ${state.isPaused ? "paused" : ""}" id="live-pill">
                <span class="live-dot"></span>
                ${state.isPaused ? "Paused" : "Live"}
              </span>
              <button class="btn btn-ghost" id="pause">${state.isPaused ? "Resume" : "Pause"}</button>
              <button class="btn btn-ghost" id="logout">Log out</button>
            </div>
          </header>

          <div class="stats">
            ${renderStat("Total users",        o.totalUsers || 0,           "Unique installs",         "")}
            ${renderStat("Active right now",   nowActive,                   "Last 5 min",              "stat-now")}
            ${renderStat("Active today",       o.dau || 0,                  "DAU",                     "")}
            ${renderStat("Active this week",   o.wau || 0,                  "WAU",                     "")}
            ${renderStat("Total events",       fmtNum(o.totalEvents || 0),  "All-time",                "")}
          </div>

          <section>
            <h2>
              <span>🎯 Waitlist <span class="h-meta">${state.waitlist.loaded ? state.waitlist.count + " signups" : "loading…"}</span></span>
              <span style="display:flex;gap:6px">
                <button class="btn btn-ghost" id="waitlist-refresh" style="font-size:11px;padding:4px 10px">↻ Refresh</button>
                <button class="btn btn-ghost" id="waitlist-csv" style="font-size:11px;padding:4px 10px">⬇ Export CSV</button>
              </span>
            </h2>
            ${renderWaitlist(state.waitlist.entries)}
          </section>

          <section>
            <h2>The funnel · last 7 days <span class="h-meta">outbound → prep → coach → follow-up → close</span></h2>
            <div class="funnel">
              ${funnelSteps.map((s, i) => `
                <div class="funnel-step">
                  <div class="funnel-label"><span class="funnel-icon">${s.icon}</span>${esc(s.label)}</div>
                  <div class="funnel-count">${fmtNum(s.count)}</div>
                  <div class="funnel-conv ${convClass(s.count, s.prev)}">${
                    s.prev != null
                      ? `${pct(s.count, s.prev)} conv`
                      : esc(s.sub)
                  }</div>
                </div>
              `).join("")}
            </div>
          </section>

          <section>
            <h2>Daily active users <span class="h-meta">last ${daily.length} days</span></h2>
            <div class="chart-box">${renderLineChart(daily)}</div>
          </section>

          <section>
            <h2>Feature usage <span class="h-meta">7-day · 30-day total</span></h2>
            <div class="features">${renderFeatures(f7, f30)}</div>
          </section>

          <section>
            <h2>Users <span class="h-meta">${users.length} total · click a row for details</span></h2>
            ${renderUsersTable(users)}
          </section>

          <section>
            <h2>Live event stream <span class="h-meta">${events.length} most recent · auto-refreshes every ${POLL_INTERVAL_MS/1000}s</span></h2>
            <div class="controls" id="event-filters">
              ${renderEventFilters(events)}
            </div>
            <div class="events" id="events-list">${renderEvents(events, users, isLiveTick)}</div>
          </section>
        </div>
      `;

      // Wire interactions
      document.getElementById("pause").addEventListener("click", togglePause);
      document.getElementById("logout").addEventListener("click", () => {
        sessionStorage.removeItem(PW_KEY);
        if (state.pollTimer) clearTimeout(state.pollTimer);
        state.isPaused = true;
        renderLogin();
      });

      const csvBtn = document.getElementById("waitlist-csv");
      if (csvBtn) csvBtn.addEventListener("click", exportWaitlistCSV);
      const wlRefreshBtn = document.getElementById("waitlist-refresh");
      if (wlRefreshBtn) wlRefreshBtn.addEventListener("click", refreshWaitlist);

      // Filter pills
      document.querySelectorAll(".filter-pill").forEach((pill) => {
        pill.addEventListener("click", () => {
          state.eventFilter = pill.dataset.filter || "all";
          renderDashboard(state.lastData);
        });
      });

      // User row clicks → drill-down modal
      document.querySelectorAll("[data-user-id]").forEach((row) => {
        row.addEventListener("click", () => openUserModal(row.dataset.userId, users, events));
      });
    }

    function renderStat(label, value, sub, cls) {
      return `
        <div class="stat ${cls || ""}">
          <div class="stat-label">${esc(label)}</div>
          <div class="stat-value">${esc(String(value))}</div>
          <div class="stat-sub">${esc(sub)}</div>
        </div>
      `;
    }

    function renderWaitlist(entries) {
      if (!state.waitlist.loaded) return `<div class="empty">Loading signups…</div>`;
      if (!entries || !entries.length) return `<div class="empty">No signups yet. Share klosr.co to start filling the list.</div>`;
      const rows = entries.map((e, i) => {
        const when = e.ts ? fmtRelative(Number(e.ts)) : "—";
        const date = e.ts ? new Date(Number(e.ts)).toLocaleString() : "";
        return `
          <tr>
            <td style="color:rgba(244,244,245,0.45);font-weight:700">${i + 1}</td>
            <td><strong>${esc(e.name || "—")}</strong></td>
            <td>${e.email ? `<a href="mailto:${esc(e.email)}">${esc(e.email)}</a>` : "—"}</td>
            <td>${e.phone ? `<a href="tel:${esc(e.phone)}" style="color:rgba(244,244,245,0.80)">${esc(e.phone)}</a>` : "—"}</td>
            <td class="hide-sm"><span class="tag">${esc(e.source || "klosr.co")}</span></td>
            <td class="hide-sm" style="color:rgba(244,244,245,0.55)" title="${esc(date)}">${esc(when)}</td>
          </tr>
        `;
      }).join("");
      return `
        <div style="overflow-x:auto; max-height:540px; overflow-y:auto">
          <table>
            <thead>
              <tr>
                <th>#</th><th>Name</th><th>Email</th><th>Phone</th>
                <th class="hide-sm">Source</th><th class="hide-sm">Joined</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function convClass(count, prev) {
      if (prev == null || prev === 0) return "";
      const ratio = count / prev;
      if (ratio >= 0.50) return "high";
      if (ratio < 0.20) return "low";
      return "";
    }

    function renderLineChart(daily) {
      if (!daily.length) return `<div class="empty">No activity yet.</div>`;
      const W = 1000, H = 130;        // viewBox dimensions; SVG scales to container width
      const padL = 38, padR = 14, padT = 14, padB = 22;
      const innerW = W - padL - padR;
      const innerH = H - padT - padB;
      const max = Math.max(1, ...daily.map(d => d.count));

      const x = (i) => padL + (daily.length === 1 ? innerW / 2 : (i / (daily.length - 1)) * innerW);
      const y = (v) => padT + innerH - (v / max) * innerH;

      const points = daily.map((d, i) => `${x(i)},${y(d.count)}`).join(" ");
      const areaPath = `M ${x(0)},${padT + innerH} L ${points.split(" ").join(" L ")} L ${x(daily.length - 1)},${padT + innerH} Z`;

      const yTicks = 4;
      const yLabels = [];
      for (let t = 0; t <= yTicks; t++) {
        const v = Math.round((max * t) / yTicks);
        yLabels.push(`<text x="${padL - 6}" y="${y(v) + 3}" class="chart-axis" text-anchor="end">${v}</text>`);
        yLabels.push(`<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,0.04)" />`);
      }

      // x-axis labels — show first, last, and middle dates
      const xLabels = [0, Math.floor((daily.length - 1) / 2), daily.length - 1].map((i) => {
        const label = (daily[i]?.date || "").slice(5); // MM-DD
        return `<text x="${x(i)}" y="${H - 6}" class="chart-axis" text-anchor="middle">${label}</text>`;
      }).join("");

      const todayIdx = daily.length - 1;
      const todayCount = daily[todayIdx]?.count || 0;

      return `
        <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#FFD60A" stop-opacity="0.55" />
              <stop offset="100%" stop-color="#FFD60A" stop-opacity="0" />
            </linearGradient>
          </defs>
          ${yLabels.join("")}
          <path class="chart-area" d="${areaPath}" />
          <polyline class="chart-line" points="${points}" />
          <circle class="chart-today" cx="${x(todayIdx)}" cy="${y(todayCount)}" r="4" />
          <text x="${x(todayIdx)}" y="${y(todayCount) - 8}" class="chart-axis" text-anchor="middle" fill="#FFD60A" font-weight="700">${todayCount}</text>
          ${xLabels}
        </svg>
      `;
    }

    function renderFeatures(f7, f30) {
      // Union of every event seen in EITHER window so we don't miss new
      // events that haven't been added to the curated list yet.
      const allKeys = new Set([...Object.keys(f7), ...Object.keys(f30)]);
      const sorted = [...allKeys].sort((a, b) => (f7[b] || 0) - (f7[a] || 0) || (f30[b] || 0) - (f30[a] || 0));
      if (!sorted.length) return `<div class="empty">No events tracked yet.</div>`;
      return sorted.map(k => {
        const c7 = f7[k] || 0;
        const c30 = f30[k] || 0;
        return `
          <div class="feature ${c7 === 0 && c30 === 0 ? "zero" : ""}">
            <span class="feature-name">${esc(k)}</span>
            <span class="feature-count">${c7}<span class="stale">/ ${c30}</span></span>
          </div>
        `;
      }).join("");
    }

    function renderUsersTable(users) {
      const sorted = users
        .filter(u => Number(u.eventCount) > 0)
        .sort((a, b) => Number(b.eventCount) - Number(a.eventCount));
      if (!sorted.length) return `<div class="empty">No active users yet.</div>`;
      const rows = sorted.map((u, i) => {
        const lastSeenMs = Number(u.lastSeen) || 0;
        const isNow    = lastSeenMs && (Date.now() - lastSeenMs) < ACTIVE_NOW_WINDOW_MS;
        const isRecent = lastSeenMs && (Date.now() - lastSeenMs) < 86400000;
        const identity = u.yourName || u.email || u.companyName
          ? `<strong>${esc(u.yourName || u.email || "—")}</strong>${u.companyName ? ` <span style="color:rgba(244,244,245,0.55)">· ${esc(u.companyName)}</span>` : ""}`
          : `<span class="mono">${esc(String(u.installId || "")).slice(0, 12)}…</span>`;
        const icp = u.icp ? esc(String(u.icp).slice(0, 80)) + (u.icp.length > 80 ? "…" : "") : "—";
        return `
          <tr data-user-id="${esc(u.installId || "")}">
            <td style="color:rgba(244,244,245,0.45);font-weight:700">${i + 1}</td>
            <td>${identity}</td>
            <td class="hide-sm" style="color:rgba(244,244,245,0.70)">${esc(u.yourRole || "")}</td>
            <td class="hide-sm" style="color:rgba(244,244,245,0.55);font-size:11px">${esc(icp)}</td>
            <td style="font-weight:700;color:#FFD60A">${u.eventCount || 0}</td>
            <td>${fmtRelative(lastSeenMs)} ${isNow ? '<span class="tag tag-now">now</span>' : isRecent ? '<span class="tag tag-hot">today</span>' : ""}</td>
            <td class="hide-sm" style="color:rgba(244,244,245,0.55)">${esc(u.lastEvent || "")}</td>
          </tr>
        `;
      }).join("");
      return `
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>#</th><th>Identity</th>
                <th class="hide-sm">Role</th><th class="hide-sm">ICP</th>
                <th>Events</th><th>Last seen</th>
                <th class="hide-sm">Last action</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderEventFilters(events) {
      // Top-N event types in the recent stream get filter pills. "All" first.
      const counts = {};
      for (const e of events) counts[e.event] = (counts[e.event] || 0) + 1;
      const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 8);
      const pills = [
        `<button class="filter-pill ${state.eventFilter === "all" ? "active" : ""}" data-filter="all">All <span style="opacity:0.55">${events.length}</span></button>`,
        ...top.map(name =>
          `<button class="filter-pill ${state.eventFilter === name ? "active" : ""}" data-filter="${esc(name)}">${esc(name)} <span style="opacity:0.55">${counts[name]}</span></button>`
        ),
      ];
      return pills.join("");
    }

    function renderEvents(events, users, isLiveTick) {
      const filter = state.eventFilter;
      const filtered = filter === "all" ? events : events.filter(e => e.event === filter);
      if (!filtered.length) return `<div class="empty">No events match this filter.</div>`;

      // Track which events are NEW this tick (for fade-in flash). Only flag
      // as "fresh" on a live tick — initial render shouldn't flash everything.
      const freshKeys = new Set();
      if (isLiveTick) {
        for (const e of filtered.slice(0, 30)) {
          const k = eventKey(e);
          if (!state.seenEventKeys.has(k)) freshKeys.add(k);
        }
      }
      // Update seen set
      for (const e of filtered) state.seenEventKeys.add(eventKey(e));
      // Cap the seen set to prevent unbounded growth (~last 500 keys)
      if (state.seenEventKeys.size > 500) {
        state.seenEventKeys = new Set(Array.from(state.seenEventKeys).slice(-500));
      }

      const userById = new Map();
      for (const u of users) if (u.installId) userById.set(u.installId, u);

      return filtered.slice(0, 100).map(e => {
        const user = userById.get(e.installId);
        const identity = user?.yourName || user?.email || (e.installId ? String(e.installId).slice(0, 10) + "…" : "—");
        const meta = e.metadata && Object.keys(e.metadata).length
          ? Object.entries(e.metadata).slice(0, 3).map(([k, v]) =>
              `${k}=${typeof v === "string" ? v.slice(0, 28) : v}`
            ).join("  ")
          : "";
        const k = eventKey(e);
        const fresh = freshKeys.has(k) ? "fresh" : "";
        return `
          <div class="event-row ${fresh}">
            <div class="event-time">${fmtTime(e.ts)}</div>
            <div class="event-name">${esc(e.event)}</div>
            <div class="event-meta">${esc(meta)}</div>
            <div class="event-user" data-user-id="${esc(e.installId || "")}">${esc(identity)}</div>
          </div>
        `;
      }).join("");
    }

    // ─────────── User drill-down modal ───────────
    function openUserModal(userId, users, events) {
      if (!userId) return;
      const user = users.find(u => u.installId === userId);
      if (!user) return;
      state.currentModalUser = userId;

      // Filter the event stream to just this user's events
      const userEvents = (events || []).filter(e => e.installId === userId).slice(0, 80);

      const grid = [];
      const add = (k, v) => { if (v) grid.push(`<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>`); };
      add("Install ID", user.installId);
      add("Name",       user.yourName || "—");
      add("Email",      user.email || "—");
      add("Role",       user.yourRole || "—");
      add("Company",    user.companyName || "—");
      add("ICP",        user.icp || "—");
      add("Events",     `${user.eventCount || 0} total`);
      add("Last seen",  fmtRelative(Number(user.lastSeen) || 0));
      add("Last action", user.lastEvent || "—");

      const timelineHtml = userEvents.length
        ? userEvents.map(e => {
            const meta = e.metadata && Object.keys(e.metadata).length
              ? Object.entries(e.metadata).slice(0, 3).map(([k, v]) =>
                  `${k}=${typeof v === "string" ? v.slice(0, 30) : v}`
                ).join("  ")
              : "";
            return `
              <div class="timeline-row">
                <div class="timeline-time">${fmtTime(e.ts)}</div>
                <div class="timeline-event">${esc(e.event)}${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</div>
              </div>
            `;
          }).join("")
        : `<div class="empty">No events in the current stream window.</div>`;

      const modalHtml = `
        <div class="modal-bg" id="modal-bg">
          <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-head">
              <div>
                <h3>${esc(user.yourName || user.email || user.installId || "User")}</h3>
                <div class="modal-sub">${esc(user.yourRole || "")}${user.yourRole && user.companyName ? " · " : ""}${esc(user.companyName || "")}</div>
              </div>
              <button class="modal-close" id="modal-close" aria-label="Close">×</button>
            </div>
            <div class="modal-body">
              <div class="modal-grid">${grid.join("")}</div>
              <div class="timeline-h">Recent activity (${userEvents.length})</div>
              <div class="timeline">${timelineHtml}</div>
            </div>
          </div>
        </div>
      `;

      const wrap = document.createElement("div");
      wrap.innerHTML = modalHtml;
      document.body.appendChild(wrap.firstElementChild);
      document.getElementById("modal-bg").addEventListener("click", closeModal);
      document.getElementById("modal-close").addEventListener("click", closeModal);
      // Esc closes
      const onKey = (e) => { if (e.key === "Escape") { closeModal(); document.removeEventListener("keydown", onKey); } };
      document.addEventListener("keydown", onKey);
    }
    function closeModal() {
      const m = document.getElementById("modal-bg");
      if (m) m.remove();
      state.currentModalUser = null;
    }

    // ─────────── Pause / resume ───────────
    function togglePause() {
      state.isPaused = !state.isPaused;
      if (state.isPaused) {
        if (state.pollTimer) clearTimeout(state.pollTimer);
        state.pollTimer = null;
      } else {
        // Immediate fetch + resume schedule
        const pw = sessionStorage.getItem(PW_KEY);
        if (pw) fetchStats(pw).then(d => { if (d?.ok) { state.lastData = d; renderDashboard(d, true); } });
        schedulePoll();
      }
      // Re-render header to reflect state
      if (state.lastData) renderDashboard(state.lastData);
    }

    // ─────────── Boot ───────────
    (async () => {
      const pw = sessionStorage.getItem(PW_KEY);
      if (!pw) { renderLogin(); return; }
      const data = await fetchStats(pw).catch(() => null);
      if (data && data.ok) startLive(data);
      else { sessionStorage.removeItem(PW_KEY); renderLogin(); }
    })();
  </script>
</body>
